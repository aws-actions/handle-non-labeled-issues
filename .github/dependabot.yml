version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
    day: tuesday
  open-pull-requests-limit: 10
  target-branch: 'main'
  commit-message:
    prefix: "chore"
    include: "scope"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    day: tuesday
  open-pull-requests-limit: 10
  target-branch: 'main'
  commit-message:
    prefix: "chore"
    include: "scope"
